name: Python CI

on:
  # Ручной запуск из UI/CLI (явный input помогает избежать глюков UI и упрощает аудит)
  workflow_dispatch:
    inputs:
      reason:
        description: "Why run CI manually?"
        required: false
        default: "manual run"
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      MPLBACKEND: 'Agg'
      TZ: 'America/Phoenix'
      # Ensure tests can import `src.*` and `prosperous_bot`:
      PYTHONPATH: "${{ github.workspace }};${{ github.workspace }}\src"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Upgrade pip/setuptools/wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install requirements (if present) + test deps
        run: |
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install pytest pytest-cov

      - name: Show environment
        run: |
          python -V
          pip -V
          pip list

      - name: Show PYTHONPATH / sys.path (debug)
        run: |
          python -c "import os,sys; print('PYTHONPATH=', os.environ.get('PYTHONPATH')); print('sys.path[0:5]=', sys.path[:5])"

      # PROBE: только unit-тесты (без @integration), без порога покрытия
      - name: "Run tests (probe: unit-only, no coverage gate)"
        if: ${{ startsWith(github.ref, 'refs/heads/feature/ci-') || startsWith(github.head_ref || '', 'feature/ci-') }}
        run: |
          pytest -q -m "not integration" --disable-warnings --maxfail=1 --cov=src/prosperous_bot --cov-report=xml

      # STRICT: все ветки вне feature/ci-* — полный набор тестов и порог покрытия ≥ 90%
      - name: "Run tests (strict: coverage >= 90)"
        if: ${{ !(startsWith(github.ref, 'refs/heads/feature/ci-') || startsWith(github.head_ref || '', 'feature/ci-')) }}
        run: |
          pytest -q --disable-warnings --maxfail=1 --cov=src/prosperous_bot --cov-report=xml --cov-fail-under=90

      - name: Upload coverage artifact
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml