name: Python CI

on:
  # уже включены path-фильтры: code/tests/config/workflows
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Основной smoke-CI на Windows; матрица 3.10/3.11
jobs:
  build:
    name: build (${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      MPLBACKEND: 'Agg'
      TZ: 'America/Phoenix'
      # Импортируем src.* и корень проекта:
      PYTHONPATH: "${{ github.workspace }};${{ github.workspace }}\\src"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Upgrade pip/setuptools/wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install requirements (if present) + test deps
        run: |
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install pytest pytest-cov

      - name: Show environment
        run: |
          python -V
          pip -V
          pip list

      - name: Show PYTHONPATH / sys.path (debug)
        run: |
          python -c "import os,sys; print('PYTHONPATH=', os.environ.get('PYTHONPATH')); print('sys.path[0:5]=', sys.path[:5])"

      # PROBE: для веток feature/ci-* запускаем pytest без порога покрытия,
      # чтобы быстро подтвердить окружение/раннер/зависимости.
      - name: Run tests (probe branch, no coverage gate)
        if: ${{ startsWith(github.ref, 'refs/heads/feature/ci-') || startsWith(github.head_ref, 'feature/ci-') }}
        run: |
          pytest -q --disable-warnings --maxfail=1 --cov=src/prosperous_bot --cov-report=xml

      # STRICT: для всех остальных веток сохраняем требование покрытия ≥ 90%.
      - name: Run tests (strict coverage gate)
        if: ${{ !startsWith(github.ref, 'refs/heads/feature/ci-') && !startsWith(github.head_ref, 'feature/ci-') }}
        run: |
          pytest -q --disable-warnings --maxfail=1 --cov=src/prosperous_bot --cov-report=xml --cov-fail-under=90

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
