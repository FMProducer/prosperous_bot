[pytest]
addopts = -ra --ignore=tests
testpaths = futures_portfolio/tests
pythonpath = futures_portfolio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: Тесты, требующие исторических данных/бэктеста; в probe-ветках CI пропускает их.
filterwarnings =
    ignore::DeprecationWarning
