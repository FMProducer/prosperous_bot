[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "futures_portfolio"
version = "0.1.0"
description = "Market Neutral Futures Trading System — Binance Futures"
requires-python = ">=3.11"

# ──────────────────────────────────────────────
#  Pytest & Coverage
# ──────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
asyncio_mode = "auto"
addopts = "-ra -v --tb=short -p no:capture --ignore=tests/test_risk_engine.py --ignore=tests/test_siphoning.py --ignore=tests/test_scoring_logic.py --ignore=tests/test_surplus_first.py"
markers = [
    "integration: tests requiring historical data or backtest; skip in CI probe branches",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "backtest_rebalance.py",
    "__pycache__/*",
    "test_dd.py",
    "*.py_time.py",
    # Tier 4: utilities (one-off scripts, not production)
    "debug_scan.py",
    "visualize_bot_log.py",
    "equity_visualizer.py",
    "voice_recognizer.py",
    "full_reset.py",
    "save_cache.py",
    "run_debug.py",
    "check_json_encoding.py",
    "check_market_data.py",
    "update_white_list.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except Exception",
]
